<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="穿过木质相框，探索森林、海底、云端、雪地、天文台、竹林、古城、列车、灯塔、沙海、蘑菇工坊与荷塘十二幕微缩世界，感受日夜与灯光变化。">
  <title>一方世界 · 沉浸式个人主页</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%2321160f'/%3E%3Cpath d='M8 7h24v26H8z' fill='none' stroke='%23d9c4a0' stroke-width='3'/%3E%3Cpath d='m14 27 6-16 6 16z' fill='%238ba771'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">

<body>
  <main class="world-window" id="world-window" tabindex="0" aria-label="森林秘境，滚动或上下滑动探索不同场景，移动鼠标探索景深。">
    <div class="world-track" id="world-track">
      <div class="world-scene"><picture><source media="(pointer: coarse) and (max-width: 512px), (pointer: coarse) and (max-height: 768px)" srcset="./assets/mobile/forest-on.webp"><img class="scene-fallback" src="./assets/forest-on.webp" fetchpriority="high" alt="木质相框中，暖光下的微缩森林与小狐狸"></picture></div>
    </div>
  </main>
  <div id="scroll-space" aria-hidden="true"></div>
  <div id="live-status" class="sr-only" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>

</html>
